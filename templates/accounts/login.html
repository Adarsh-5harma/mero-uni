{% extends "base/base.html" %}
{% block title %}Login — Mero-Uni{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5"
     style="background: linear-gradient(135deg, #04314f 0%, #034770 50%, #185379 100%);">
  <div class="card border-0 shadow-lg p-4 p-md-5" style="width:100%;max-width:440px;border-radius:16px;">
    <div class="text-center mb-4">
      <h4 class="fw-bold" style="color:#04314f;">🎓 Mero-Uni</h4>
      <p class="text-muted small mb-0">CSAI Resources Platform</p>
    </div>
    <ul class="nav nav-pills nav-fill mb-4 border rounded-3 overflow-hidden">
      <li class="nav-item">
        <a class="nav-link rounded-0 text-secondary fw-semibold" href="{% url 'signup' %}">Sign Up</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active rounded-0 fw-semibold" style="background:#04314f;">Login</a>
      </li>
    </ul>
    <h5 class="fw-semibold mb-1" style="color:#04314f;">Welcome back</h5>
    <p class="text-muted small mb-4">Login to access your resources</p>
    {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold small" style="color:#374151;">Username</label>
        <input type="text" name="username" class="form-control"
               style="border:1.5px solid #d1e3f0;border-radius:8px;background:#f8fbfe;"
               placeholder="Your username">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold small" style="color:#374151;">Password</label>
        <input type="password" name="password" class="form-control"
               style="border:1.5px solid #d1e3f0;border-radius:8px;background:#f8fbfe;"
               placeholder="Your password">
      </div>
      <button type="submit" class="btn w-100 text-white fw-semibold py-2 mt-1"
              style="background:#04314f;border-radius:8px;font-size:0.95rem;">
        Login
      </button>
    </form>
    <p class="text-center text-muted small mt-3 mb-0">
      No account? <a href="{% url 'signup' %}" style="color:#185379;font-weight:600;">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
